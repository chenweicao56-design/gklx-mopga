databaseType: 5236
tableSqlList:
  - sql: "SELECT
    TABLE_NAME ,
    COMMENTS AS TABLE_COMMENT
FROM
    ALL_TAB_COMMENTS
WHERE
    OWNER = ?
    AND (TABLE_TYPE = 'TABLE'
             OR TABLE_TYPE = 'VIEW')"
    columns:
      - "TABLE_NAME"
      - "TABLE_COMMENT"
      - "CREATE_TIME"
      - "UPDATE_TIME"
tableFieldSqlList:
  - sql: "SELECT
    C.COLUMN_NAME,
    CASE
        WHEN C.DATA_TYPE IN ('NUMBER', 'DECIMAL','DEC', 'NUMERIC') THEN
            C.DATA_TYPE || '(' || NVL(C.DATA_PRECISION, '') || DECODE(NVL(C.DATA_SCALE, -1), -1, '', ',' || C.DATA_SCALE) || ')'
        WHEN C.DATA_TYPE IN ('VARCHAR', 'CHAR', 'CHARACTER', 'VARCHAR', 'VARCHAR2', 'VARBINARY', 'RAW', 'BINARY', 'CLOB', 'TEXT') THEN
            C.DATA_TYPE || '(' || NVL(C.DATA_LENGTH, '') || ')'
        WHEN C.DATA_TYPE IN ('FLOAT', 'DOUBLE', 'DOUBLE PRECISION') THEN
            C.DATA_TYPE || '(' || NVL(C.DATA_PRECISION, '') || ')'
        WHEN C.DATA_TYPE IN ('TIME', 'TIMESTAMP', 'DATETIME') THEN
            C.DATA_TYPE || '(' || NVL(C.DATA_SCALE, '') || ')'
        ELSE
            C.DATA_TYPE
    END AS                        COLUMN_TYPE,
    C.DATA_SCALE,
    COALESCE(COM.COMMENTS, '') AS COLUMN_COMMENT,
    (
         CASE
             WHEN (C.NULLABLE = 'N') THEN
                 '1'
             ELSE
                 '0'
         END) AS                  IS_NULL,
    C.DATA_DEFAULT AS             COLUMN_DEFAULT,
    (
         CASE
             WHEN PK.COLUMN_NAME IS NOT NULL THEN
                 '1'
             ELSE
                 '0'
         END) AS                  IS_PK,
    AI.IS_IDENTITY AS             IS_INCREMENT
FROM
    ALL_TAB_COLS C
LEFT JOIN
    ALL_COL_COMMENTS COM
ON 
    C.OWNER = COM.OWNER
    AND C.TABLE_NAME = COM.TABLE_NAME
    AND C.COLUMN_NAME = COM.COLUMN_NAME
LEFT JOIN (
    SELECT
        CC.OWNER,
        CC.TABLE_NAME,
        CC.COLUMN_NAME
    FROM
        ALL_CONS_COLUMNS CC
    INNER JOIN
        ALL_CONSTRAINTS CON
    ON
        CC.OWNER = CON.OWNER
        AND CC.TABLE_NAME = CON.TABLE_NAME
        AND CC.CONSTRAINT_NAME = CON.CONSTRAINT_NAME
    WHERE
        CON.CONSTRAINT_TYPE = 'P' AND CC.OWNER= ?
) PK
ON
    C.OWNER = PK.OWNER
    AND C.TABLE_NAME = PK.TABLE_NAME
    AND C.COLUMN_NAME = PK.COLUMN_NAME

LEFT JOIN
    ( SELECT AO.OBJECT_NAME AS TABLE_NAME ,SC.NAME AS COLUMN_NAME, SC.INFO2 AS IS_IDENTITY
       FROM ALL_OBJECTS AO 
       LEFT JOIN SYSCOLUMNS SC ON SC.ID = AO.OBJECT_ID
       WHERE  AO.OWNER=?
          AND AO.OBJECT_NAME=?) AI
ON
     C.TABLE_NAME = AI.TABLE_NAME
    AND C.COLUMN_NAME = AI.COLUMN_NAME
WHERE
    C.OWNER = ? AND  C.TABLE_NAME = ?"
    columns:
      - "COLUMN_NAME"
      - "IS_NULL"
      - "IS_PK"
      - "SORT"
      - "COLUMN_COMMENT"
      - "IS_INCREMENT"
      - "COLUMN_TYPE"
      - "COLUMN_DEFAULT"

